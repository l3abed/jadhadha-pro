name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "jadhadha-pro.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Chaquopy يحتاج Python على جهاز البناء بنفس إصدار التطبيق (3.13)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unpack project
        run: |
          rm -rf proj && mkdir proj
          unzip -q jadhadha-pro.zip -d proj
          ls proj

      - name: Scan for leaked keys
        run: |
          if grep -rInE "AIza|AQ\.[A-Za-z0-9_-]{20,}" proj/app/src; then
            echo "::error::Leaked API key pattern detected"; exit 1
          fi

      - name: Accept Android licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Build release APK
        working-directory: proj
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          cp proj/app/build/outputs/apk/release/app-release.apk jadhadha-pro.apk
          ls -la jadhadha-pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jadhadha-pro-apk
          path: jadhadha-pro.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" jadhadha-pro.apk \
            --title "الجذاذة النموذجية $TAG" \
            --notes "نسخة جديدة. نزّل ملف jadhadha-pro.apk وثبّته على الهاتف."
